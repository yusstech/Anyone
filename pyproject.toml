[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "anyone-ai"
version = "0.1.0.dev0"
description = "Simulate anyone from public sources. Every quote is verbatim, cited and machine-checked."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Yusuf Muhammed" }]
keywords = ["ai", "persona", "simulation", "rag", "citations", "digital-twin", "llm", "claude"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anthropic>=2.4",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "protego>=0.3",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
mcp = ["mcp>=2.3"]
dev = ["pytest>=8", "pypdf>=4.0", "mcp>=2.3"]

[project.scripts]
anyone = "anyone_ai.cli:main"

[project.urls]
Repository = "https://github.com/yusstech/Anyone"

[tool.hatch.build.targets.wheel]
packages = ["src/anyone_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Anthropic API (needs ANTHROPIC_API_KEY; run with -m live)"]
addopts = "-m 'not live'"
